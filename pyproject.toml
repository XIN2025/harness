[project]
name = "oracle-eval"
version = "0.1.0"
description = "Eval harness measuring prompt-only optimisation on code-structure extraction, scored against scip-typescript"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.15",
    "tenacity>=9.0",
    "scipy>=1.15",
    "numpy>=2.1",
    "python-dotenv>=1.0",
    "rich>=13.9",
]

[project.optional-dependencies]
arms = [
    "openai>=1.59",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-typescript>=0.23.2,<0.24",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.14",
    "scipy-stubs>=1.15",
]

[project.scripts]
harness = "oracle_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle_eval"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
